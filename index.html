<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fun fun</title>
<link rel="stylesheet" href="assets/app.css?v=14" />

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#7c3aed" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Fun fun" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
</head>
<body>

<header class="app-header">
  <h1>Fun fun</h1>
  <div class="header-right">
    <span class="sync-status" id="syncStatus"></span>
    <button class="icon-btn" id="btnDeleteMode" title="삭제 모드" aria-label="삭제 모드">🗑</button>
    <button class="icon-btn" id="btnEdit" title="편집 잠금/해제" aria-label="편집">🔒</button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="분류">
  <button class="tab active" role="tab" data-cat="money"  aria-selected="true">경제</button>
  <button class="tab"        role="tab" data-cat="estate" aria-selected="false">부동산</button>
  <button class="tab"        role="tab" data-cat="make"   aria-selected="false">만들기</button>
  <button class="tab"        role="tab" data-cat="cook"   aria-selected="false">요리</button>
  <button class="tab"        role="tab" data-cat="trivia" aria-selected="false">정보</button>
  <button class="tab"        role="tab" data-cat="edu"    aria-selected="false">교육</button>
  <button class="tab"        role="tab" data-cat="travel" aria-selected="false">여행</button>
</nav>

<main class="app-main">
  <div class="cards" id="cards"></div>
</main>

<button class="fab-add" id="btnAdd" type="button" aria-label="링크 등록">＋</button>

<!-- 이동/복사 시트 (카드 길게 누르기) -->
<dialog id="moveDialog" class="dialog sheet">
  <div class="sheet-body">
    <div class="move-title" id="moveTitle"></div>
    <button type="button" class="btn link-copy" id="moveLinkCopy">📋 링크 주소 복사</button>
    <div class="move-section">
      <span class="move-label">다른 탭으로 이동</span>
      <div class="move-cats" id="moveCatsMove"></div>
    </div>
    <div class="move-section">
      <span class="move-label">다른 탭으로 복사</span>
      <div class="move-cats" id="moveCatsCopy"></div>
    </div>
    <button type="button" class="btn ghost move-cancel" id="moveCancel">취소</button>
  </div>
</dialog>

<!-- 앱 내 뷰어 — 뒤로가기 시 닫혀 앱 목록으로 복귀 -->
<div class="viewer hidden" id="viewer" role="dialog" aria-modal="true">
  <div class="viewer-bar">
    <button class="viewer-close" id="viewerClose" type="button">← 돌아가기</button>
    <span class="viewer-host" id="viewerHost"></span>
    <a class="viewer-open" id="viewerOpen" target="_blank" rel="noopener noreferrer">새 탭 ↗</a>
  </div>
  <iframe class="viewer-frame" id="viewerFrame" title="미리보기"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen></iframe>
  <div class="viewer-fallback hidden" id="viewerFallback">
    <p id="viewerFallbackMsg">이 콘텐츠는 앱 안에서 재생할 수 없어요.<br/>해당 서비스에서 열어주세요.</p>
    <a class="btn" id="viewerFallbackOpen" target="_blank" rel="noopener noreferrer">열기 ↗</a>
  </div>
</div>

<!-- 등록 모달 -->
<dialog id="addDialog" class="dialog">
  <form id="addForm" method="dialog">
    <h2 id="addTitle">링크 등록</h2>
    <label class="field">
      <span>URL</span>
      <input type="url" id="fUrl" inputmode="url" autocomplete="off"
             placeholder="https://… (유튜브·블로그·기사 등)" required />
    </label>
    <label class="field">
      <span>분류</span>
      <select id="fCategory">
        <option value="money">경제</option>
        <option value="estate">부동산</option>
        <option value="make">만들기</option>
        <option value="cook">요리</option>
        <option value="trivia">정보</option>
        <option value="edu">교육</option>
        <option value="travel">여행</option>
      </select>
    </label>
    <label class="field">
      <span>메모 (선택)</span>
      <input type="text" id="fNote" autocomplete="off" placeholder="간단 메모" />
    </label>

    <!-- 미리보기 (등록 전 확인) -->
    <div class="preview hidden" id="preview"></div>

    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="addCancel">취소</button>
      <button type="button" class="btn" id="addSave">등록</button>
    </div>
    <div class="add-status" id="addStatus"></div>
  </form>
</dialog>

<script src="assets/app.js?v=14"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
